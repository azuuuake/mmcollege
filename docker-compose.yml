services:
  db:
    image: postgres:16-alpine
    container_name: mmconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmconnect
      POSTGRES_PASSWORD: mmconnect
      POSTGRES_DB: mmconnect
    ports:
      - "5432:5432"
    volumes:
      - mmconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmconnect -d mmconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mmconnect_pgdata:
